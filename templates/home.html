<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRAYAN - Route</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .route-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .location-input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>PRAYAN</h1>

    <div class="route-box">

        <h2>Plan Your Journey</h2>

        <input
            type="text"
            id="pickup_location"
            class="location-input"
            placeholder="Enter pickup location (e.g. Amravati)"
        >

        <br>

        <input
            type="text"
            id="destination"
            class="location-input"
            placeholder="Enter destination (e.g. Pune)"
        >

        <br>

        <button onclick="getRoute()">Show Route</button>

        <div id="result"></div>

        <button
            id="bookingButton"
            onclick="goToBooking()"
            style="display: none; margin-top: 15px;"
        >
            Continue to Booking
        </button>

    </div>

    <div id="map"></div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // Create map
        const map = L.map("map").setView([20.9287, 77.7565], 7);

        // OpenStreetMap tiles
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // Get route from Flask
        async function getRoute() {

            const pickup =
                document.getElementById("pickup_location").value.trim();

            const destination =
                document.getElementById("destination").value.trim();

            if (!pickup) {
                alert("Please enter a pickup location.");
                return;
            }

            if (!destination) {
                alert("Please enter a destination.");
                return;
            }

            if (pickup.toLowerCase() === destination.toLowerCase()) {
                alert("Pickup and destination cannot be the same.");
                return;
            }

            document.getElementById("result").innerHTML =
                "Finding route...";

            try {

                const response = await fetch(
                    `/route?pickup_location=${encodeURIComponent(pickup)}&destination=${encodeURIComponent(destination)}`
                );

                const data = await response.json();

                console.log(data);


                if (data.error) {

                    document.getElementById("result").innerHTML =
                        data.error;

                    return;
                }


                // Show distance and duration
                document.getElementById("result").innerHTML =
                    `<strong>Distance:</strong> ${data.distance} km
                    <br>
                    <strong>Duration:</strong> ${Math.round(data.duration)} minutes`;

                document.getElementById("bookingButton").style.display =
                    "inline-block";


                // Draw route
                const routeLayer = L.geoJSON(data.route, {
                    style: {
                        weight: 5
                    }
                }).addTo(map);


                // Get route coordinates
                const coordinates = data.route.coordinates;


                // First coordinate = pickup
                const firstCoordinate = coordinates[0];

                const pickupLatLng = [
                    firstCoordinate[1],
                    firstCoordinate[0]
                ];


                // Last coordinate = destination
                const lastCoordinate =
                    coordinates[coordinates.length - 1];

                const destinationLatLng = [
                    lastCoordinate[1],
                    lastCoordinate[0]
                ];


                // Pickup marker
                L.marker(pickupLatLng)
                    .addTo(map)
                    .bindPopup(`Pickup: ${pickup}`)
                    .openPopup();


                // Destination marker
                L.marker(destinationLatLng)
                    .addTo(map)
                    .bindPopup(`Destination: ${data.destination}`);


                // Zoom map to route
                map.fitBounds(
                    routeLayer.getBounds(),
                    {
                        padding: [30, 30]
                    }
                );

            } catch (error) {

                console.error(error);

                document.getElementById("result").innerHTML =
                    "Something went wrong while finding the route.";

            }

        }


        function goToBooking() {

            const pickup =
                document.getElementById("pickup_location").value.trim();

            const destination =
                document.getElementById("destination").value.trim();

            window.location.href =
                `/booking?pickup_location=${encodeURIComponent(pickup)}&destination=${encodeURIComponent(destination)}`;
        }

    </script>

</body>

</html>
