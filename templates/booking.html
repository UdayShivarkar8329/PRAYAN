<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PRAYAN - Booking</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="/" class="logo">PRAYAN</a>

        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/booking">Services</a></li>
          <li><a href="/cars">Cars</a></li>
          <li><a href="/drivers">Drivers</a></li>
          <li><a href="/my-bookings">My Bookings</a></li>
          <li><a href="/login">Login</a></li>
        </ul>
      </div>
    </nav>

    <main class="container">
      <div class="form-container">
        <h1 class="section-title">Book Your Journey</h1>

        <p style="text-align: center; margin-bottom: 30px">
          Enter your trip details to continue.
        </p>

        <form method="POST" action="/booking">
          <!-- Service Type -->
          <div class="form-group">
            <label for="service_type"> Service Type </label>

            <select id="service_type" name="service_type" required>
              <option value="">Select a service</option>

              <option
                value="car"
                {%
                if
                service_type == "car"
                %}selected{%
                endif
                %}
              >
                Car Only
              </option>

              <option
                value="driver"
                {%
                if
                service_type == "driver"
                %}selected{%
                endif
                %}
              >
                Driver Only
              </option>

              <option
                value="car_driver"
                {%
                if
                service_type == "car_driver"
                %}selected{%
                endif
                %}
              >
                Car + Driver
              </option>
            </select>
          </div>

          <!-- Pickup -->
          <div class="form-group">
            <label for="pickup_location"> Pickup Location </label>

            <input
              type="text"
              id="pickup_location"
              name="pickup_location"
              value="{{ pickup_location or 'Amravati' }}"
              required
            />
          </div>

          <!-- Destination -->
          <div class="form-group">
            <label for="destination"> Destination </label>

            <input
              type="text"
              id="destination"
              name="destination"
              value="{{ destination or '' }}"
              placeholder="Enter your destination"
              required
            />
          </div>

          <!-- Start Date -->
          <div class="form-group">
            <label for="start_date"> Start Date </label>

            <input type="date" id="start_date" name="start_date" required />
          </div>

          <!-- End Date -->
          <div class="form-group">
            <label for="end_date"> End Date </label>

            <input type="date" id="end_date" name="end_date" required />
          </div>

          <!-- Car -->
          <div class="form-group">
            <label for="car_id"> Car </label>

            <select id="car_id" name="car_id">
              <option value="">No car selected</option>

              <option value="1" {% if car_id == "1" %}selected{% endif %}>
                Maruti Ertiga
              </option>

              <option value="2" {% if car_id == "2" %}selected{% endif %}>
                Maruti Swift
              </option>

              <option value="3" {% if car_id == "3" %}selected{% endif %}>
                Mahindra Scorpio
              </option>
            </select>
          </div>

          <!-- Driver -->
          <div class="form-group">
            <label for="driver_id"> Driver </label>

            <select id="driver_id" name="driver_id">
              <option value="">No driver selected</option>

              <option value="1" {% if driver_id == "1" %}selected{% endif %}>
                Rahul Patil
              </option>

              <option value="2" {% if driver_id == "2" %}selected{% endif %}>
                Akash Sharma
              </option>

              <option value="3" {% if driver_id == "3" %}selected{% endif %}>
                Vijay Deshmukh
              </option>
            </select>
          </div>
          <button type="submit" class="btn">Continue to Booking Summary</button>
        </form>
      </div>
    </main>

    <footer class="footer">
      <p>Â© 2026 PRAYAN â€” Your Journey, Your Choice.</p>
    </footer>
  </body>
</html>
